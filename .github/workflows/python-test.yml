name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: python -m pytest
      - run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/fortune-wheel
          /tmp/fortune-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/fortune-wheel/bin/python "$GITHUB_WORKSPACE/tests/installed_smoke.py"
