[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortune_teller"
version = "0.1.0"
description = "基于LLM的多系统算命程序"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fortune Teller Team"}]
dependencies = ["pyyaml>=6.0", "python-dateutil>=2.8.0", "lunar_python==1.4.8"]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
deepseek = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
bedrock = ["boto3>=1.28.0"]
all = ["openai>=1.0.0", "anthropic>=0.40.0", "boto3>=1.28.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "build>=1.0", "flake8>=7"]

[project.scripts]
fortune-teller = "fortune_teller.main:main"

[tool.setuptools.packages.find]
include = ["fortune_teller*"]

[tool.setuptools.package-data]
fortune_teller = ["i18n/locales/*.json", "plugins/*/manifest.yaml", "data/tarot/*.json"]
